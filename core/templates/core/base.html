<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Ishxona{% endblock %}</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1d2330; --muted:#677084; --line:#e2e5ea;
          --accent:#2563eb; --ok:#15803d; --ok-bg:#e8f6ec; --bad:#b91c1c; --bad-bg:#fdecec; --warn:#a16207; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:12px 16px;
           display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  header b { font-size:17px; }
  main { max-width:1000px; margin:0 auto; padding:16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  h2 { font-size:17px; margin:0 0 12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .muted { color:var(--muted); }
  .badge { background:var(--accent); color:#fff; border-radius:999px; padding:1px 9px; font-size:13px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:13px; color:var(--muted); font-weight:600; }
  td.num, th.num { text-align:right; white-space:nowrap; }
  .scroll { overflow-x:auto; }
  button, .btn { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--text);
                 border-radius:7px; padding:6px 12px; cursor:pointer; }
  button.ok { background:var(--ok); border-color:var(--ok); color:#fff; }
  button.bad { color:var(--bad); border-color:#f1b5b5; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  input, select { font:inherit; border:1px solid var(--line); border-radius:7px; padding:6px 8px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .msg { padding:10px 14px; border-radius:8px; margin-bottom:12px; }
  .msg.success { background:var(--ok-bg); color:var(--ok); }
  .msg.error { background:var(--bad-bg); color:var(--bad); }
  .status-approved { color:var(--ok); }
  .status-rejected { color:var(--bad); }
  .status-pending { color:var(--warn); }
  details summary { cursor:pointer; color:var(--accent); }
  details form { margin-top:8px; }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
